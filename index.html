<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#7c3aed">
<meta name="description" content="Lit en Lingo — Literature, Languages and Literary Analysis">
<title>Lit en Lingo — Literature & Language Learning</title>

<style>
/* =========================================================
   LIT EN LINGO — AESTHETIC DESIGN SYSTEM
   ========================================================= */

:root{
 --bg:#f7f5fc;
 --surface:rgba(255,255,255,.82);
 --surface-solid:#fff;
 --surface2:#f0ebfa;
 --text:#191523;
 --muted:#6d6878;
 --primary:#7c3aed;
 --primary2:#a855f7;
 --pink:#ec4899;
 --blue:#38bdf8;
 --green:#22c55e;
 --red:#ef4444;
 --border:rgba(124,58,237,.14);
 --shadow:0 14px 45px rgba(48,25,85,.10);
 --radius:22px;
 --glass:rgba(255,255,255,.65);
}

[data-theme="dark"]{
 --bg:#0b0911;
 --surface:rgba(24,19,34,.82);
 --surface-solid:#181321;
 --surface2:#241d31;
 --text:#f8f5ff;
 --muted:#aaa2b8;
 --primary:#a78bfa;
 --primary2:#c084fc;
 --pink:#f472b6;
 --blue:#38bdf8;
 --border:rgba(196,181,253,.15);
 --shadow:0 18px 55px rgba(0,0,0,.35);
 --glass:rgba(24,19,34,.68);
}

*{box-sizing:border-box}

html{
 scroll-behavior:smooth;
}

body{
 margin:0;
 color:var(--text);
 background:
   radial-gradient(circle at 10% 10%,rgba(124,58,237,.16),transparent 27%),
   radial-gradient(circle at 90% 15%,rgba(236,72,153,.13),transparent 25%),
   radial-gradient(circle at 50% 100%,rgba(56,189,248,.10),transparent 30%),
   var(--bg);
 background-attachment:fixed;
 font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 line-height:1.6;
 overflow-x:hidden;
}

body:before,
body:after{
 content:"";
 position:fixed;
 z-index:-1;
 border-radius:50%;
 filter:blur(70px);
 pointer-events:none;
 animation:orbMove 14s ease-in-out infinite alternate;
}

body:before{
 width:300px;
 height:300px;
 left:-100px;
 top:30%;
 background:rgba(124,58,237,.13);
}

body:after{
 width:260px;
 height:260px;
 right:-80px;
 bottom:10%;
 background:rgba(236,72,153,.10);
 animation-delay:-5s;
}

@keyframes orbMove{
 0%{transform:translate(0,0) scale(1)}
 50%{transform:translate(50px,-35px) scale(1.12)}
 100%{transform:translate(-25px,30px) scale(.95)}
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.65}
a{color:inherit}

::selection{
 background:var(--primary);
 color:white;
}

/* ---------- Floating literary particles ---------- */

.particles{
 position:fixed;
 inset:0;
 pointer-events:none;
 overflow:hidden;
 z-index:-1;
}

.particle{
 position:absolute;
 color:var(--primary);
 opacity:.12;
 font-family:Georgia,serif;
 animation:floatParticle linear infinite;
}

@keyframes floatParticle{
 from{transform:translateY(110vh) rotate(0deg)}
 to{transform:translateY(-120px) rotate(360deg)}
}

/* ---------- Topbar ---------- */

.topbar{
 position:sticky;
 top:0;
 z-index:100;
 border-bottom:1px solid var(--border);
 background:var(--glass);
 backdrop-filter:blur(20px);
 -webkit-backdrop-filter:blur(20px);
}

.topbar-inner{
 max-width:1250px;
 margin:auto;
 padding:11px 18px;
 display:flex;
 align-items:center;
 gap:13px;
}

.logo{
 border:0;
 background:none;
 color:var(--text);
 display:flex;
 align-items:center;
 gap:10px;
 padding:0;
 min-width:max-content;
}

.logo-mark{
 width:46px;
 height:46px;
 border-radius:16px;
 display:grid;
 place-items:center;
 color:white;
 font-size:24px;
 font-weight:1000;
 letter-spacing:-3px;
 background:linear-gradient(135deg,var(--primary),var(--pink));
 box-shadow:0 9px 25px rgba(124,58,237,.30);
 animation:logoPulse 3s ease-in-out infinite;
}

@keyframes logoPulse{
 0%,100%{transform:translateY(0) rotate(0)}
 50%{transform:translateY(-3px) rotate(-2deg)}
}

.logo-text{
 font-size:20px;
 font-weight:950;
 letter-spacing:-.8px;
}

.logo-text span{color:var(--primary)}

.search{
 flex:1;
 max-width:500px;
 position:relative;
 margin-left:auto;
}

.search input{
 width:100%;
 padding:12px 15px 12px 43px;
 border:1px solid var(--border);
 border-radius:15px;
 outline:none;
 color:var(--text);
 background:var(--surface2);
 transition:.25s;
}

.search input:focus{
 border-color:var(--primary);
 box-shadow:0 0 0 4px rgba(124,58,237,.10);
 transform:translateY(-1px);
}

.search-icon{
 position:absolute;
 left:14px;
 top:8px;
 font-size:20px;
 pointer-events:none;
}

.icon-btn,
.theme-btn,
.menu-btn{
 border:1px solid var(--border);
 background:var(--surface);
 color:var(--text);
 border-radius:13px;
 padding:9px 12px;
 transition:.2s;
}

.icon-btn:hover,
.theme-btn:hover,
.menu-btn:hover{
 transform:translateY(-2px);
 border-color:var(--primary);
 color:var(--primary);
}

.menu-btn{display:none}

/* ---------- Layout ---------- */

.layout{
 max-width:1250px;
 margin:auto;
 display:grid;
 grid-template-columns:245px 1fr;
 gap:23px;
 padding:23px 18px;
}

.sidebar{
 position:sticky;
 top:82px;
 height:calc(100vh - 105px);
 overflow:auto;
 padding:7px;
}

.nav-title{
 color:var(--muted);
 font-size:10px;
 font-weight:900;
 letter-spacing:1.6px;
 text-transform:uppercase;
 margin:17px 11px 7px;
}

.nav-btn{
 width:100%;
 border:0;
 background:transparent;
 color:var(--text);
 padding:11px 13px;
 border-radius:13px;
 display:flex;
 align-items:center;
 gap:10px;
 text-align:left;
 margin:2px 0;
 transition:.2s;
}

.nav-btn:hover{
 background:var(--surface2);
 transform:translateX(3px);
}

.nav-btn.active{
 background:linear-gradient(135deg,rgba(124,58,237,.15),rgba(236,72,153,.08));
 color:var(--primary);
 font-weight:850;
 box-shadow:inset 3px 0 var(--primary);
}

/* ---------- General ---------- */

.content{min-width:0}

.hero{
 position:relative;
 overflow:hidden;
 padding:39px;
 border-radius:30px;
 color:white;
 background:
   radial-gradient(circle at 90% 10%,rgba(255,255,255,.17),transparent 24%),
   radial-gradient(circle at 10% 90%,rgba(56,189,248,.16),transparent 28%),
   linear-gradient(135deg,#6d28d9,#4c1d95 52%,#db2777);
 box-shadow:0 25px 70px rgba(76,29,149,.22);
 animation:heroIn .7s ease both;
}

.hero:before{
 content:"";
 position:absolute;
 width:250px;
 height:250px;
 right:-90px;
 top:-100px;
 border:1px solid rgba(255,255,255,.18);
 border-radius:50%;
 box-shadow:0 0 0 40px rgba(255,255,255,.03),
            0 0 0 80px rgba(255,255,255,.02);
 animation:spinSlow 20s linear infinite;
}

.hero:after{
 content:"EN";
 position:absolute;
 right:20px;
 bottom:-55px;
 font-size:190px;
 line-height:1;
 font-weight:1000;
 letter-spacing:-25px;
 opacity:.08;
}

@keyframes spinSlow{to{transform:rotate(360deg)}}

@keyframes heroIn{
 from{opacity:0;transform:translateY(20px) scale(.98)}
 to{opacity:1;transform:none}
}

.hero h1{
 position:relative;
 z-index:1;
 font-family:Georgia,"Times New Roman",serif;
 font-size:clamp(34px,5vw,60px);
 line-height:1;
 margin:0 0 14px;
 letter-spacing:-2px;
 max-width:750px;
}

.hero p{
 position:relative;
 z-index:1;
 max-width:720px;
 color:#f3eaff;
 font-size:17px;
 margin:0 0 23px;
}

.hero-actions{
 position:relative;
 z-index:2;
 display:flex;
 flex-wrap:wrap;
 gap:10px;
}

.btn{
 border:0;
 border-radius:13px;
 padding:11px 17px;
 font-weight:850;
 color:white;
 background:linear-gradient(135deg,var(--primary),var(--primary2));
 box-shadow:0 8px 20px rgba(124,58,237,.18);
 transition:.2s;
}

.btn:hover{
 transform:translateY(-3px);
 box-shadow:0 13px 28px rgba(124,58,237,.25);
}

.btn.light{
 background:white;
 color:#4c1d95;
}

.btn.ghost{
 background:transparent;
 border:1px solid var(--border);
 color:var(--text);
 box-shadow:none;
}

.hero .ghost{
 color:white;
 border-color:rgba(255,255,255,.35);
}

/* ---------- Stats ---------- */

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:13px;
 margin:18px 0;
}

.stat{
 position:relative;
 overflow:hidden;
 background:var(--surface);
 border:1px solid var(--border);
 border-radius:18px;
 padding:17px;
 box-shadow:var(--shadow);
 backdrop-filter:blur(10px);
 animation:rise .55s ease both;
}

.stat:nth-child(2){animation-delay:.08s}
.stat:nth-child(3){animation-delay:.16s}
.stat:nth-child(4){animation-delay:.24s}

@keyframes rise{
 from{opacity:0;transform:translateY(15px)}
 to{opacity:1;transform:none}
}

.stat:after{
 content:"";
 position:absolute;
 width:80px;
 height:80px;
 border-radius:50%;
 background:var(--primary);
 opacity:.05;
 right:-30px;
 top:-30px;
}

.stat b{
 display:block;
 color:var(--primary);
 font-size:27px;
 line-height:1.1;
}

.stat span{
 color:var(--muted);
 font-size:12px;
}

/* ---------- Sections ---------- */

.section{
 margin:32px 0;
 animation:sectionIn .4s ease both;
}

@keyframes sectionIn{
 from{opacity:0;transform:translateY(8px)}
 to{opacity:1;transform:none}
}

.section-head{
 display:flex;
 align-items:end;
 justify-content:space-between;
 gap:12px;
 margin-bottom:14px;
}

.section h2{
 margin:0;
 font-family:Georgia,"Times New Roman",serif;
 font-size:27px;
 letter-spacing:-.6px;
}

.section-sub{
 margin:2px 0 0;
 color:var(--muted);
 font-size:14px;
}

/* ---------- Cards ---------- */

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:14px;
}

.card{
 background:var(--surface);
 border:1px solid var(--border);
 border-radius:20px;
 padding:19px;
 box-shadow:var(--shadow);
 backdrop-filter:blur(10px);
 transition:.25s;
 animation:cardIn .45s ease both;
}

.card:hover{
 transform:translateY(-5px);
 box-shadow:0 20px 50px rgba(48,25,85,.14);
 border-color:rgba(124,58,237,.27);
}

@keyframes cardIn{
 from{opacity:0;transform:translateY(13px)}
 to{opacity:1;transform:none}
}

.card-top{
 display:flex;
 justify-content:space-between;
 gap:10px;
}

.card h3{
 margin:8px 0 4px;
 font-size:18px;
}

.card p{
 margin:5px 0;
 color:var(--muted);
 font-size:14px;
}

.emoji{
 font-size:30px;
}

.tag{
 display:inline-flex;
 align-items:center;
 border:1px solid var(--border);
 background:var(--surface2);
 color:var(--text);
 padding:4px 9px;
 border-radius:999px;
 font-size:11px;
 font-weight:800;
 margin:3px 3px 0 0;
}

.card-actions{
 display:flex;
 gap:7px;
 flex-wrap:wrap;
 margin-top:13px;
}

.small-btn{
 border:1px solid var(--border);
 background:var(--surface2);
 color:var(--text);
 border-radius:10px;
 padding:7px 10px;
 font-size:12px;
 font-weight:800;
 transition:.2s;
}

.small-btn:hover{
 transform:translateY(-2px);
 border-color:var(--primary);
}

.small-btn.primary{
 color:white;
 background:var(--primary);
 border-color:var(--primary);
}

/* ---------- Toolbar ---------- */

.toolbar{
 display:flex;
 gap:9px;
 flex-wrap:wrap;
 margin-bottom:15px;
}

.toolbar input,
.toolbar select{
 border:1px solid var(--border);
 border-radius:12px;
 padding:10px 12px;
 background:var(--surface);
 color:var(--text);
 outline:none;
}

.toolbar input:focus,
.toolbar select:focus{
 border-color:var(--primary);
}

/* ---------- Chips ---------- */

.chips{
 display:flex;
 gap:7px;
 overflow:auto;
 padding-bottom:5px;
}

.chip{
 white-space:nowrap;
 border:1px solid var(--border);
 background:var(--surface);
 color:var(--text);
 padding:8px 13px;
 border-radius:999px;
 font-size:12px;
 font-weight:800;
 transition:.2s;
}

.chip:hover{transform:translateY(-2px)}

.chip.active{
 background:var(--primary);
 color:white;
 border-color:var(--primary);
}

/* ---------- Work cards ---------- */

.work-card{
 display:grid;
 grid-template-columns:72px 1fr;
 gap:14px;
}

.work-icon{
 width:72px;
 height:72px;
 display:grid;
 place-items:center;
 border-radius:17px;
 background:linear-gradient(135deg,var(--surface2),rgba(124,58,237,.10));
 font-size:32px;
}

/* ---------- Lessons ---------- */

.lesson{
 background:var(--surface);
 border:1px solid var(--border);
 border-radius:20px;
 padding:21px;
 margin-bottom:14px;
 box-shadow:var(--shadow);
}

.lesson h3{margin-top:0}

.lesson ol,
.lesson ul{
 padding-left:23px;
}

.example{
 background:var(--surface2);
 border-left:4px solid var(--primary);
 padding:12px 15px;
 border-radius:0 12px 12px 0;
 margin:11px 0;
}

/* ---------- Progress ---------- */

.progress-wrap{
 height:10px;
 background:var(--surface2);
 border-radius:99px;
 overflow:hidden;
}

.progress{
 height:100%;
 width:0;
 background:linear-gradient(90deg,var(--primary),var(--pink),var(--blue));
 border-radius:99px;
 transition:width .7s ease;
}

/* ---------- Notes ---------- */

.note-area{
 width:100%;
 min-height:180px;
 resize:vertical;
 border:1px solid var(--border);
 border-radius:15px;
 padding:14px;
 background:var(--surface);
 color:var(--text);
 outline:none;
}

.note-area:focus{
 border-color:var(--primary);
 box-shadow:0 0 0 4px rgba(124,58,237,.08);
}

/* ---------- Quiz ---------- */

.quiz-option{
 width:100%;
 text-align:left;
 border:1px solid var(--border);
 background:var(--surface);
 color:var(--text);
 border-radius:12px;
 padding:12px;
 margin:6px 0;
 transition:.2s;
}

.quiz-option:hover{
 border-color:var(--primary);
 transform:translateX(3px);
}

.quiz-option.correct{
 border-color:var(--green);
 background:rgba(34,197,94,.12);
}

.quiz-option.wrong{
 border-color:var(--red);
 background:rgba(239,68,68,.12);
}

/* ---------- Definition ---------- */

.definition-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:14px;
}

/* ---------- Modal ---------- */

.modal{
 position:fixed;
 inset:0;
 z-index:300;
 display:none;
 align-items:center;
 justify-content:center;
 padding:18px;
 background:rgba(0,0,0,.62);
 backdrop-filter:blur(8px);
}

.modal.open{
 display:flex;
 animation:fadeIn .2s ease;
}

@keyframes fadeIn{
 from{opacity:0}
 to{opacity:1}
}

.modal-box{
 width:100%;
 max-width:800px;
 max-height:90vh;
 overflow:auto;
 background:var(--surface-solid);
 border:1px solid var(--border);
 border-radius:25px;
 padding:25px;
 box-shadow:0 35px 100px rgba(0,0,0,.4);
 animation:modalIn .3s ease;
}

@keyframes modalIn{
 from{opacity:0;transform:translateY(25px) scale(.96)}
 to{opacity:1;transform:none}
}

.modal-head{
 display:flex;
 justify-content:space-between;
 gap:15px;
 align-items:start;
}

.close{
 border:0;
 background:var(--surface2);
 color:var(--text);
 border-radius:10px;
 padding:7px 11px;
}

.close:hover{color:var(--primary)}

/* ---------- Toast ---------- */

.toast{
 position:fixed;
 right:18px;
 bottom:18px;
 z-index:500;
 padding:12px 16px;
 border-radius:13px;
 background:var(--text);
 color:var(--bg);
 box-shadow:var(--shadow);
 opacity:0;
 transform:translateY(15px);
 transition:.25s;
 pointer-events:none;
}

.toast.show{
 opacity:1;
 transform:none;
}

/* ---------- Empty ---------- */

.empty{
 padding:40px 20px;
 text-align:center;
 border:1px dashed var(--border);
 border-radius:20px;
 color:var(--muted);
}

/* ---------- Footer ---------- */

.footer{
 margin-top:55px;
 padding:30px 10px;
 text-align:center;
 color:var(--muted);
 font-size:13px;
 border-top:1px solid var(--border);
}

.footer strong{color:var(--primary)}

/* ---------- Utility ---------- */

.hide{display:none!important}

.kbd{
 font-size:10px;
 border:1px solid var(--border);
 background:var(--surface2);
 padding:2px 6px;
 border-radius:5px;
 color:var(--muted);
}

.favorite{
 font-size:18px;
 border:0;
 background:none;
 color:var(--muted);
 transition:.2s;
}

.favorite:hover{
 transform:scale(1.2);
 color:var(--pink);
}

.favorite.active{color:var(--pink)}

.table-wrap{overflow:auto}

table{
 width:100%;
 border-collapse:collapse;
}

th,td{
 padding:9px;
 border-bottom:1px solid var(--border);
 text-align:left;
}

th{font-size:12px}
td{font-size:13px}

/* ---------- Mobile ---------- */

@media(max-width:950px){
 .layout{
  grid-template-columns:1fr;
 }
 .sidebar{
  position:fixed;
  z-index:200;
  top:69px;
  left:0;
  width:285px;
  height:calc(100vh - 69px);
  padding:12px;
  background:var(--surface-solid);
  border-right:1px solid var(--border);
  transform:translateX(-110%);
  transition:.3s;
  box-shadow:20px 0 60px rgba(0,0,0,.15);
 }
 .sidebar.open{transform:none}
 .menu-btn{display:block}
 .grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:650px){
 .topbar-inner{
  padding:9px 10px;
  gap:7px;
 }
 .logo-text{display:none}
 .logo-mark{
  width:42px;
  height:42px;
 }
 .search{max-width:none}
 .layout{padding:14px 11px}
 .hero{
  padding:27px 20px;
  border-radius:23px;
 }
 .hero h1{font-size:35px}
 .stats{grid-template-columns:repeat(2,1fr)}
 .grid,
 .definition-grid{
  grid-template-columns:1fr;
 }
 .section h2{font-size:22px}
 .work-card{grid-template-columns:60px 1fr}
 .work-icon{
  width:60px;
  height:60px;
 }
}

@media(prefers-reduced-motion:reduce){
 *,
 *:before,
 *:after{
  animation-duration:.01ms!important;
  animation-iteration-count:1!important;
  scroll-behavior:auto!important;
  transition-duration:.01ms!important;
 }
}
</style>
</head>

<body>

<div class="particles" id="particles"></div>

<header class="topbar">
 <div class="topbar-inner">

  <button class="logo" onclick="showPage('home')">
   <div class="logo-mark">en</div>
   <div class="logo-text">Lit <span>en</span> Lingo</div>
  </button>

  <button class="menu-btn" onclick="toggleSidebar()">☰</button>

  <div class="search">
   <span class="search-icon">⌕</span>
   <input id="globalSearch"
          placeholder="Search literature, writers, works..."
          onkeydown="if(event.key==='Enter')globalSearch(this.value)">
  </div>

  <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">☾</button>
 </div>
</header>

<div class="layout">

<aside class="sidebar" id="sidebar">

 <div class="nav-title">Explore</div>

 <button class="nav-btn active" data-page="home" onclick="showPage('home')">🏠 Home</button>
 <button class="nav-btn" data-page="literature" onclick="showPage('literature')">📚 Literature Library</button>
 <button class="nav-btn" data-page="writers" onclick="showPage('writers')">✍️ Writers & Poets</button>
 <button class="nav-btn" data-page="works" onclick="showPage('works')">📖 Works & Summaries</button>
 <button class="nav-btn" data-page="themes" onclick="showPage('themes')">🎭 Themes & Genres</button>
 <button class="nav-btn" data-page="devices" onclick="showPage('devices')">🧩 Literary Devices</button>
 <button class="nav-btn" data-page="compare" onclick="showPage('compare')">⚖️ Compare Writers</button>

 <div class="nav-title">Language</div>

 <button class="nav-btn" data-page="languages" onclick="showPage('languages')">🌍 Language Lab</button>

 <div class="nav-title">Practice</div>

 <button class="nav-btn" data-page="quiz" onclick="showPage('quiz')">🧠 Practice Quiz</button>
 <button class="nav-btn" data-page="notes" onclick="showPage('notes')">📝 My Notes</button>
 <button class="nav-btn" data-page="favorites" onclick="showPage('favorites')">♡ Favorites</button>
 <button class="nav-btn" data-page="progress" onclick="showPage('progress')">◔ Progress</button>

 <div class="nav-title">Shortcut</div>

 <div class="card" style="padding:13px">
  <p style="margin:0;font-size:12px">
   Press <span class="kbd">Ctrl</span> + <span class="kbd">K</span>
   to search quickly.
  </p>
 </div>

</aside>

<main class="content" id="content"></main>

</div>

<div class="footer">
 <strong>Lit en Lingo</strong> · Learn literature. Explore languages. Think critically.
 <br>Everything is stored locally in your browser.
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
 <div class="modal-box">
  <div class="modal-head">
   <div id="modalTitle"></div>
   <button class="close" onclick="closeModal()">✕</button>
  </div>
  <div id="modalBody"></div>
 </div>
</div>

function save(){

 document.documentElement.dataset.theme=state.theme;

/* =========================================================
   HELPERS
   ========================================================= */

function esc(s){
 return String(s??"").replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[m]));
}

function isFav(type,id){
 return state.favorites.includes(type+":"+id);
}

function toggleFav(type,id){
 const key=type+":"+id;
 if(state.favorites.includes(key)){
  state.favorites=state.favorites.filter(x=>x!==key);
  toast("Removed from favorites");
 }else{
  state.favorites.push(key);
  toast("Added to favorites ♡");
 }
 save();
 render();
}

function complete(key){
 if(!state.completed.includes(key)){
  state.completed.push(key);
  save();
 }
}

function toast(message){
 const t=document.getElementById("toast");
 t.textContent=message;
 t.classList.add("show");
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}

function openModal(title,body){
 document.getElementById("modalTitle").innerHTML="<h2 style='margin:0'>"+title+"</h2>";
 document.getElementById("modalBody").innerHTML=body;
 document.getElementById("modal").classList.add("open");
 document.body.style.overflow="hidden";
}

function closeModal(){
 document.getElementById("modal").classList.remove("open");
 document.body.style.overflow="";
}

 document.getElementById("sidebar").classList.toggle("open");
}

/* =========================================================

function quizPage(){
 return `
 <section class="section">
  <div class="section-head">
   <div>
    <h2>🧠 Practice Quiz</h2>
    <p class="section-sub">Ten questions with instant explanations.</p>
   </div>
   <span class="tag">Session score: ${state.quizScore}/${state.quizAnswered}</span>
  </div>

  <div id="quizBox"></div>
 </section>
 `;
}

function startQuiz(){
 let index=0;
 let score=0;

 function draw(){
  if(index>=quiz.length){
   state.quizScore=score;
   state.quizAnswered=quiz.length;

   document.getElementById("quizBox").innerHTML=`
    <div class="hero">
     <h2>🎉 Quiz Complete!</h2>
     <p>You scored <b>${score}/${quiz.length}</b>.</p>
     <button class="btn light" onclick="startQuiz()">Try Again</button>
    </div>
   `;
   return;
  }

  const q=quiz[index];

  document.getElementById("quizBox").innerHTML=`
   <div class="lesson">
    <span class="tag">Question ${index+1} of ${quiz.length}</span>
    <h3>${esc(q.q)}</h3>

    ${q.o.map((x,i)=>`
     <button class="quiz-option" onclick="answer(${i})">
      ${String.fromCharCode(65+i)}. ${esc(x)}
     </button>
    `).join("")}

    <div id="quizFeedback"></div>
   </div>
  `;
 }

 window.answer=function(choice){
  const q=quiz[index];
  const buttons=document.querySelectorAll(".quiz-option");

  buttons.forEach((b,i)=>{
   b.disabled=true;
   if(i===q.a)b.classList.add("correct");
   if(i===choice&&choice!==q.a)b.classList.add("wrong");
  });

  const correct=choice===q.a;
  if(correct)score++;

  document.getElementById("quizFeedback").innerHTML=`
   <div class="example">
    <b>${correct?"✓ Correct!":"✗ Not quite."}</b>
    ${esc(q.e)}
    <br>
    <button class="small-btn primary"
     style="margin-top:9px"
     onclick="index++;draw()">
     ${index===quiz.length-1?"Finish":"Next"} →
    </button>
   </div>
  `;
 };

 draw();
}

/* =========================================================
   GLOBAL SEARCH
   ========================================================= */

function globalSearch(q){
 if(!q.trim())return;

 const low=q.toLowerCase();

 const work=works.find(x=>
  (x.title+" "+x.author+" "+x.summary+" "+x.themes.join(" "))
  .toLowerCase().includes(low)
 );

 const writer=writers.find(x=>
  (x.name+" "+x.bio+" "+x.tradition+" "+x.period)
  .toLowerCase().includes(low)
 );

 const lit=literatures.find(x=>
  (x.name+" "+x.desc+" "+x.writers.join(" ")+" "+x.themes.join(" "))
  .toLowerCase().includes(low)
 );

 const device=devices.find(x=>
  (x[0]+" "+x[1]+" "+x[2]+" "+x[3])
  .toLowerCase().includes(low)
 );

 if(work){
  showPage("works");
  setTimeout(()=>{
   document.getElementById("workSearch").value=q;
   filterWorks(q);
  },50);
 }
 else if(writer){
  showPage("writers");
  setTimeout(()=>{
   document.getElementById("writerSearch").value=q;
   filterWriters(q);
  },50);
 }
 else if(lit){
  showPage("literature");
  setTimeout(()=>{
   document.getElementById("litSearch").value=q;
   filterLiterature(q);
  },50);
 }
 else if(device){
  showPage("devices");
  setTimeout(()=>{
   document.querySelector("#deviceGrid")
    .parentElement.querySelector("input").value=q;
   filterDevices(q);
  },50);
 }
 else{
  toast("No result found");
 }
}

/* =========================================================
   PARTICLES
   ========================================================= */

function createParticles(){
 const container=document.getElementById("particles");
 const symbols=["✦","✧","•","❖","“","”","A","a","∞","✒"];

 for(let i=0;i<24;i++){
  const el=document.createElement("span");
  el.className="particle";
  el.textContent=symbols[Math.floor(Math.random()*symbols.length)];
  el.style.left=Math.random()*100+"%";
  el.style.fontSize=(12+Math.random()*24)+"px";
  el.style.animationDuration=(12+Math.random()*18)+"s";
  el.style.animationDelay=(-Math.random()*20)+"s";
  container.appendChild(el);
 }
}

/* =========================================================
   KEYBOARD SHORTCUTS
   ========================================================= */

document.addEventListener("keydown",e=>{
 if(e.key==="Escape")closeModal();

 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){
  e.preventDefault();
  document.getElementById("globalSearch").focus();
 }
});

/* =========================================================
   START APP
   ========================================================= */

document.getElementById("themeBtn").textContent=
 state.theme==="dark"?"☀":"☾";

createParticles();
render();

</script>
