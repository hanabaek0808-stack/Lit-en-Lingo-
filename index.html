<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="description" content="Lit en Lingo — Learn Literature and Languages">

<title>Lit en Lingo</title>

<style>
/* =========================================================
   LIT EN LINGO
   Complete single-file Literature + Language Learning App
   ========================================================= */

:root{
  --bg:#f7f7fb;
  --surface:rgba(255,255,255,.82);
  --surface2:#ffffff;
  --text:#171421;
  --muted:#716d7c;
  --border:rgba(20,15,40,.09);
  --primary:#7c3aed;
  --primary2:#ec4899;
  --blue:#3b82f6;
  --green:#10b981;
  --orange:#f59e0b;
  --red:#ef4444;
  --shadow:0 15px 45px rgba(40,20,80,.10);
  --radius:24px;
}

[data-theme="dark"]{
  --bg:#0c0912;
  --surface:rgba(25,20,35,.84);
  --surface2:#17121f;
  --text:#f8f5ff;
  --muted:#aaa1b8;
  --border:rgba(255,255,255,.09);
  --shadow:0 18px 50px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

/* ---------- Animated background ---------- */

.background{
  position:fixed;
  inset:0;
  z-index:-5;
  overflow:hidden;
  pointer-events:none;
}

.blob{
  position:absolute;
  width:420px;
  height:420px;
  border-radius:50%;
  filter:blur(70px);
  opacity:.18;
  animation:floatBlob 15s infinite alternate ease-in-out;
}

.blob.one{
  background:#8b5cf6;
  top:-140px;
  left:-120px;
}

.blob.two{
  background:#ec4899;
  right:-160px;
  top:15%;
  animation-delay:2s;
}

.blob.three{
  background:#06b6d4;
  bottom:-170px;
  left:25%;
  animation-delay:5s;
}

@keyframes floatBlob{
  from{transform:translate(0,0) scale(1)}
  to{transform:translate(80px,50px) scale(1.18)}
}

.particle{
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--primary);
  opacity:.18;
  animation:particleFloat linear infinite;
}

@keyframes particleFloat{
  from{
    transform:translateY(110vh) translateX(0);
  }
  to{
    transform:translateY(-20vh) translateX(100px);
  }
}

/* ---------- App shell ---------- */

.app{
  max-width:1500px;
  margin:auto;
  min-height:100vh;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  height:76px;
  display:flex;
  align-items:center;
  gap:18px;
  padding:12px 22px;
  background:var(--surface);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:210px;
  font-weight:900;
  font-size:20px;
  letter-spacing:-.5px;
}

.logoMark{
  width:44px;
  height:44px;
  border-radius:15px;
  display:grid;
  place-items:center;
  color:white;
  background:linear-gradient(135deg,#7c3aed,#ec4899);
  box-shadow:0 8px 25px rgba(124,58,237,.28);
  font-family:Georgia,serif;
  font-size:22px;
  position:relative;
  overflow:hidden;
}

.logoMark::after{
  content:"";
  position:absolute;
  inset:-50%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.45),transparent);
  animation:shine 4s infinite;
}

@keyframes shine{
  0%,60%{transform:translateX(-100%) rotate(25deg)}
  100%{transform:translateX(100%) rotate(25deg)}
}

.searchBox{
  flex:1;
  max-width:600px;
  position:relative;
}

.searchBox input{
  width:100%;
  padding:13px 18px 13px 45px;
  border-radius:16px;
  border:1px solid var(--border);
  background:var(--surface2);
  color:var(--text);
  outline:none;
  font-size:14px;
}

.searchIcon{
  position:absolute;
  left:16px;
  top:12px;
}

.topActions{
  margin-left:auto;
  display:flex;
  gap:9px;
}

.iconBtn{
  width:44px;
  height:44px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--surface2);
  color:var(--text);
  cursor:pointer;
  font-size:18px;
  transition:.25s;
}

.iconBtn:hover{
  transform:translateY(-2px);
  border-color:var(--primary);
}

/* ---------- Layout ---------- */

.layout{
  display:grid;
  grid-template-columns:250px 1fr;
}

.sidebar{
  position:sticky;
  top:76px;
  height:calc(100vh - 76px);
  padding:20px 14px;
  border-right:1px solid var(--border);
  overflow:auto;
}

.navTitle{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.5px;
  color:var(--muted);
  margin:16px 12px 8px;
}

.navBtn{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  border:0;
  background:transparent;
  color:var(--muted);
  padding:12px 14px;
  border-radius:14px;
  cursor:pointer;
  text-align:left;
  font-size:14px;
  transition:.2s;
}

.navBtn:hover{
  background:rgba(124,58,237,.08);
  color:var(--primary);
}

.navBtn.active{
  color:white;
  background:linear-gradient(135deg,#7c3aed,#9333ea);
  box-shadow:0 8px 20px rgba(124,58,237,.2);
}

.main{
  padding:28px;
  min-width:0;
}

.mobileNav{
  display:none;
}

/* ---------- Typography ---------- */

.pageTitle{
  font-size:34px;
  line-height:1.1;
  letter-spacing:-1.3px;
  margin-bottom:8px;
}

.pageSub{
  color:var(--muted);
  margin-bottom:25px;
}

.gradientText{
  background:linear-gradient(90deg,#7c3aed,#ec4899,#3b82f6);
  -webkit-background-clip:text;
  color:transparent;
}

/* ---------- Cards ---------- */

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  backdrop-filter:blur(16px);
}

.cardPad{
  padding:22px;
}

.grid{
  display:grid;
  gap:18px;
}

.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}

button{
  font-family:inherit;
}

.primary{
  border:0;
  border-radius:14px;
  padding:12px 18px;
  color:white;
  background:linear-gradient(135deg,#7c3aed,#ec4899);
  cursor:pointer;
  font-weight:750;
  transition:.25s;
}

.primary:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 25px rgba(124,58,237,.25);
}

.secondary{
  border:1px solid var(--border);
  border-radius:14px;
  padding:11px 16px;
  color:var(--text);
  background:var(--surface2);
  cursor:pointer;
  font-weight:650;
}

.small{
  padding:8px 12px;
  font-size:12px;
}

.tag{
  display:inline-flex;
  padding:6px 10px;
  border-radius:999px;
  background:rgba(124,58,237,.1);
  color:var(--primary);
  font-size:11px;
  font-weight:750;
}

/* ---------- Hero ---------- */

.hero{
  min-height:310px;
  position:relative;
  overflow:hidden;
  padding:34px;
  display:flex;
  align-items:center;
  border-radius:32px;
  background:
    radial-gradient(circle at 90% 15%,rgba(236,72,153,.35),transparent 30%),
    radial-gradient(circle at 15% 90%,rgba(59,130,246,.25),transparent 30%),
    linear-gradient(135deg,#241044,#56208a 55%,#8b236b);
  color:white;
  box-shadow:0 25px 60px rgba(71,35,110,.28);
}

.hero::before{
  content:"";
  position:absolute;
  width:250px;
  height:250px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:50%;
  right:-50px;
  top:-70px;
  animation:spin 18s linear infinite;
}

.hero::after{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:50%;
  right:90px;
  bottom:-70px;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.heroContent{
  position:relative;
  z-index:2;
  max-width:750px;
}

.hero h1{
  font-size:48px;
  line-height:1;
  letter-spacing:-2px;
  margin-bottom:16px;
}

.hero p{
  color:rgba(255,255,255,.78);
  max-width:650px;
  line-height:1.7;
  margin-bottom:22px;
}

.heroButtons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

/* ---------- Stats ---------- */

.stat{
  padding:20px;
}

.statIcon{
  font-size:25px;
  margin-bottom:12px;
}

.statValue{
  font-size:27px;
  font-weight:900;
}

.statLabel{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

/* ---------- Section ---------- */

.sectionHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:28px 0 14px;
}

.sectionHead h2{
  font-size:20px;
}

.sectionHead span{
  color:var(--muted);
  font-size:12px;
}

/* ---------- Learning cards ---------- */

.course{
  padding:20px;
  position:relative;
  overflow:hidden;
  cursor:pointer;
  transition:.25s;
}

.course:hover{
  transform:translateY(-5px);
}

.courseIcon{
  width:50px;
  height:50px;
  display:grid;
  place-items:center;
  border-radius:17px;
  background:rgba(124,58,237,.1);
  font-size:24px;
  margin-bottom:15px;
}

.course h3{
  margin-bottom:6px;
}

.course p{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.progress{
  height:7px;
  border-radius:20px;
  background:rgba(127,127,127,.15);
  overflow:hidden;
  margin-top:16px;
}

.progressBar{
  height:100%;
  border-radius:20px;
  background:linear-gradient(90deg,#7c3aed,#ec4899);
  transition:width .5s;
}

/* ---------- Language ---------- */

.languageCard{
  padding:20px;
  cursor:pointer;
  transition:.25s;
}

.languageCard:hover{
  transform:translateY(-5px) scale(1.01);
}

.langScript{
  font-size:30px;
  margin:12px 0;
}

.langName{
  font-weight:850;
  font-size:18px;
}

.langNative{
  color:var(--muted);
  font-size:13px;
}

.levelPills{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:14px;
}

.levelPills span{
  padding:5px 9px;
  border-radius:8px;
  font-size:10px;
  background:rgba(124,58,237,.09);
}

/* ---------- Lesson ---------- */

.lessonCard{
  padding:28px;
}

.lessonNumber{
  font-size:12px;
  color:var(--primary);
  font-weight:800;
  margin-bottom:10px;
}

.lessonTitle{
  font-size:28px;
  margin-bottom:10px;
}

.lessonText{
  color:var(--muted);
  line-height:1.8;
  margin-bottom:20px;
}

.example{
  padding:18px;
  border-radius:18px;
  background:rgba(124,58,237,.07);
  border-left:4px solid var(--primary);
  margin:14px 0;
}

.example .foreign{
  font-size:24px;
  font-weight:800;
}

.example .meaning{
  margin-top:5px;
  color:var(--muted);
}

.example .pron{
  margin-top:5px;
  color:var(--primary);
  font-size:12px;
}

/* ---------- Flashcard ---------- */

.flashArea{
  max-width:700px;
  margin:auto;
}

.flashcard{
  min-height:330px;
  padding:35px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  cursor:pointer;
  perspective:1000px;
}

.flashWord{
  font-size:54px;
  font-weight:900;
  margin:18px 0;
}

.flashHint{
  color:var(--muted);
}

.flashAnswer{
  display:none;
}

.flashcard.revealed .flashAnswer{
  display:block;
}

.flashcard.revealed .flashHint{
  display:none;
}

.flashActions{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-top:15px;
}

/* ---------- Literature ---------- */

.periodCard{
  padding:20px;
  min-height:180px;
  position:relative;
}

.periodDate{
  color:var(--primary);
  font-size:12px;
  font-weight:800;
}

.periodCard h3{
  margin:8px 0;
}

.periodCard p{
  color:var(--muted);
  font-size:13px;
  line-height:1.55;
}

.writerCard{
  padding:20px;
}

.writerAvatar{
  width:55px;
  height:55px;
  border-radius:18px;
  display:grid;
  place-items:center;
  color:white;
  font-weight:900;
  font-size:19px;
  background:linear-gradient(135deg,#7c3aed,#ec4899);
  margin-bottom:15px;
}

.writerCard h3{
  margin-bottom:4px;
}

.writerCard p{
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

.workCard{
  padding:20px;
}

.workCard h3{
  margin:8px 0;
}

.workMeta{
  color:var(--primary);
  font-size:12px;
}

.workCard p{
  color:var(--muted);
  line-height:1.55;
  font-size:13px;
}

/* ---------- Quiz ---------- */

.quiz{
  max-width:800px;
  margin:auto;
}

.question{
  font-size:22px;
  font-weight:800;
  line-height:1.4;
  margin:20px 0;
}

.option{
  display:block;
  width:100%;
  text-align:left;
  padding:15px;
  margin:9px 0;
  border-radius:15px;
  border:1px solid var(--border);
  background:var(--surface2);
  color:var(--text);
  cursor:pointer;
  transition:.2s;
}

.option:hover{
  border-color:var(--primary);
  transform:translateX(3px);
}

.option.correct{
  border-color:var(--green);
  background:rgba(16,185,129,.1);
}

.option.wrong{
  border-color:var(--red);
  background:rgba(239,68,68,.1);
}

.quizResult{
  text-align:center;
  padding:35px;
}

/* ---------- Search ---------- */

.searchResults{
  display:grid;
  gap:12px;
}

.result{
  padding:15px;
  border:1px solid var(--border);
  border-radius:16px;
  background:var(--surface);
  cursor:pointer;
}

.result small{
  color:var(--primary);
}

.result p{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

/* ---------- Notes ---------- */

textarea{
  width:100%;
  min-height:180px;
  resize:vertical;
  border:1px solid var(--border);
  border-radius:18px;
  background:var(--surface2);
  color:var(--text);
  padding:16px;
  outline:none;
  font:inherit;
}

.noteItem{
  padding:17px;
  border:1px solid var(--border);
  border-radius:17px;
  background:var(--surface2);
}

.noteDate{
  color:var(--muted);
  font-size:11px;
  margin-top:7px;
}

/* ---------- Modal ---------- */

.modalWrap{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  place-items:center;
  padding:20px;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(10px);
}

.modalWrap.show{
  display:grid;
}

.modal{
  width:min(850px,100%);
  max-height:88vh;
  overflow:auto;
  background:var(--surface2);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:28px;
  box-shadow:0 30px 100px rgba(0,0,0,.3);
  animation:modalIn .25s ease;
}

@keyframes modalIn{
  from{opacity:0;transform:translateY(20px) scale(.97)}
  to{opacity:1;transform:none}
}

.modalHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:22px;
  border-bottom:1px solid var(--border);
}

.modalBody{
  padding:25px;
}

.close{
  width:38px;
  height:38px;
  border:0;
  border-radius:12px;
  background:rgba(127,127,127,.12);
  color:var(--text);
  cursor:pointer;
}

/* ---------- Toast ---------- */

.toast{
  position:fixed;
  z-index:200;
  bottom:25px;
  left:50%;
  transform:translateX(-50%) translateY(30px);
  padding:13px 20px;
  background:#17121f;
  color:white;
  border-radius:15px;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  box-shadow:0 15px 35px rgba(0,0,0,.25);
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ---------- Achievement ---------- */

.achievement{
  display:flex;
  align-items:center;
  gap:15px;
  padding:17px;
}

.badge{
  width:50px;
  height:50px;
  border-radius:16px;
  display:grid;
  place-items:center;
  font-size:23px;
  background:rgba(245,158,11,.12);
}

.achievement p{
  color:var(--muted);
  font-size:12px;
}

/* ---------- Responsive ---------- */

@media(max-width:1050px){
  .grid4{grid-template-columns:repeat(2,1fr)}
  .grid3{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:800px){

  .topbar{
    height:68px;
    padding:10px 14px;
  }

  .logo{
    min-width:auto;
  }

  .logoText{
    display:none;
  }

  .searchBox{
    max-width:none;
  }

  .sidebar{
    display:none;
  }

  .layout{
    display:block;
  }

  .main{
    padding:18px 14px 95px;
  }

  .mobileNav{
    display:flex;
    position:fixed;
    z-index:80;
    bottom:10px;
    left:10px;
    right:10px;
    height:67px;
    border:1px solid var(--border);
    background:var(--surface);
    backdrop-filter:blur(20px);
    border-radius:22px;
    box-shadow:0 15px 40px rgba(0,0,0,.16);
    justify-content:space-around;
    align-items:center;
  }

  .mobileNav button{
    background:none;
    border:0;
    color:var(--muted);
    font-size:11px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }

  .mobileNav button.active{
    color:var(--primary);
    font-weight:800;
  }

  .hero{
    padding:27px 22px;
    min-height:350px;
  }

  .hero h1{
    font-size:37px;
  }

  .pageTitle{
    font-size:29px;
  }

  .grid2,
  .grid3,
  .grid4{
    grid-template-columns:1fr;
  }

  .topActions .iconBtn:nth-child(2){
    display:none;
  }

  .flashWord{
    font-size:42px;
  }
}

/* ---------- Reduced motion ---------- */

@media(prefers-reduced-motion:reduce){
  *,
  *::before,
  *::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>

<body>

<div class="background">
  <div class="blob one"></div>
  <div class="blob two"></div>
  <div class="blob three"></div>
</div>

<div id="particles"></div>

<div class="app">

<header class="topbar">

  <div class="logo">
    <div class="logoMark">en</div>
    <div class="logoText">
      <div>Lit en Lingo</div>
      <small style="color:var(--muted);font-weight:500">Literature × Languages</small>
    </div>
  </div>

  <div class="searchBox">
    <span class="searchIcon">⌕</span>
    <input
      id="globalSearch"
      placeholder="Search writers, books, languages, concepts..."
      oninput="globalSearch(this.value)"
    >
  </div>

  <div class="topActions">
    <button class="iconBtn" onclick="toggleTheme()" title="Theme">☼</button>
    <button class="iconBtn" onclick="showPage('notes')" title="Notes">📝</button>
    <button class="iconBtn" onclick="showPage('profile')" title="Profile">◉</button>
  </div>

</header>

<div class="layout">

<aside class="sidebar">

  <div class="navTitle">Learn</div>

  <button class="navBtn active" data-page="home" onclick="showPage('home')">
    🏠 Home
  </button>

  <button class="navBtn" data-page="languages" onclick="showPage('languages')">
    🌐 Language Lab
  </button>

  <button class="navBtn" data-page="literature" onclick="showPage('literature')">
    📚 Literature
  </button>

  <button class="navBtn" data-page="writers" onclick="showPage('writers')">
    ✒️ Writers & Poets
  </button>

  <button class="navBtn" data-page="works" onclick="showPage('works')">
    📖 Works & Summaries
  </button>

  <button class="navBtn" data-page="devices" onclick="showPage('devices')">
    ✨ Literary Devices
  </button>

  <button class="navBtn" data-page="theories" onclick="showPage('theories')">
    🧠 Literary Theories

["Simile","A comparison using words such as like or as.","“Her smile was like sunlight.”"],
["Personification","Giving human qualities to non-human things.","“The wind whispered.”"],
["Alliteration","Repetition of initial consonant sounds.","“Wild winds wandered.”"],
["Assonance","Repetition of vowel sounds.","“The mellow wedding bells.”"],
["Onomatopoeia","A word that imitates a sound.","buzz, hiss, bang"],
["Irony","A contrast between appearance and underlying meaning or expectation.","A fire station catches fire."],
["Symbolism","Using an object, image or action to represent a larger idea.","A dove can symbolize peace."],
["Imagery","Language that creates sensory experience.","Descriptions of smell, sight, sound or touch."],
["Foreshadowing","Hints about events that may happen later.","A warning before a later disaster."],
["Satire","Using humor, irony or exaggeration to criticize.","Political or social satire."],
["Allegory","A narrative whose elements consistently represent abstract ideas.","A journey representing spiritual development."],
["Soliloquy","A dramatic speech revealing a character's thoughts, usually while alone.","Hamlet's soliloquies."],
["Dramatic Irony","The audience knows something a character does not.","A character enters a room while the audience knows danger is waiting."],
["Stream of Consciousness","Narrative that attempts to represent the flow of thoughts.","Modernist interior narration."],
["Metafiction","Fiction that draws attention to its own fictional construction.","A narrator discussing the writing of the novel."],
["Free Indirect Discourse","Narration that blends third-person narration with a character's language or perspective.","Commonly associated with Austen."],
["Enjambment","Continuation of a poetic sentence beyond the line break.","The sentence continues into the next line."],
["Caesura","A deliberate pause within a poetic line.","A strong internal pause."],
["Motif","A recurring image, idea or element that gains significance.","Repeated images of birds in a poem."]
];

const theories = [

["Formalism","Focuses on literary form, structure, language and devices rather than author biography."],
["Structuralism","Studies underlying systems, patterns and binary oppositions that organize texts."],
["Post-structuralism","Questions stable meanings and emphasizes ambiguity, difference and instability."],
["Marxist Criticism","Examines class, labor, economic power and ideology."],
["Feminist Criticism","Examines gender, representation, patriarchy and women's literary experiences."],
["Psychoanalytic Criticism","Uses concepts concerning the unconscious, desire, repression and identity."],
["Postcolonial Criticism","Studies colonialism, empire, resistance, identity and cultural representation."],
["Reader-Response","Emphasizes the reader's role in creating or interpreting meaning."],
["New Historicism","Places literature within networks of historical, cultural and political power."],
["Ecocriticism","Studies relationships between literature, environment and ecological thought."],
["Queer Theory","Examines sexuality, gender categories and assumptions about identity."],
["Narratology","Studies narrative structure, time, perspective, voice and storytelling."]
];

["Tragedy","A dramatic form involving serious conflict and often catastrophic consequences."],
["Comedy","A genre generally involving humorous situations and social resolution."],

["Short Story","A shorter prose narrative focused on a limited set of events or characters."],
["Lyric","Poetry expressing personal thought, emotion or reflection."],
["Elegy","A poem of mourning or reflection on death."],

  localStorage.setItem("litEnLingoState",JSON.stringify(state));

function todayKey(){
  return new Date().toISOString().slice(0,10);
}

  state.todayXP = 0;
  state.lastDay = todayKey();
  saveState();

/* =========================================================
   BASIC UI
   ========================================================= */

function toast(message){
  const t=document.getElementById("toast");
  t.textContent=message;
  t.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(()=>{
    t.classList.remove("show");
  },2200);
}

function addXP(amount){
  state.xp+=amount;
  state.todayXP+=amount;
  saveState();

  toast("+"+amount+" XP ✨");
  updateStats();
}

function updateStats(){
  const xp=document.getElementById("xpValue");
  const streak=document.getElementById("streakValue");

  if(xp)xp.textContent=state.xp;
  if(streak)streak.textContent=state.streak;
}

function complete(id,amount=10){
  if(!state.completed[id]){
    state.completed[id]=true;
    addXP(amount);
  }else{
    toast("Already completed ✓");
  }

  saveState();
}

function toggleTheme(){
  state.theme=state.theme==="dark"?"light":"dark";
  document.documentElement.dataset.theme=state.theme;
  saveState();
}

document.documentElement.dataset.theme=state.theme;

  document.querySelectorAll(".mobileNav button").forEach(btn=>{

  });

  const main=document.getElementById("main");

  const pages={
    home:renderHome,
    languages:renderLanguages,
    literature:renderLiterature,
    writers:renderWriters,
    works:renderWorks,
    devices:renderDevices,
    theories:renderTheories,
    flashcards:renderFlashcards,
    quiz:renderQuiz,
    sentences:renderSentences,
    scripts:renderScripts,
    favorites:renderFavorites,
    notes:renderNotes,
    progress:renderProgress,
    profile:renderProfile
  };

  main.innerHTML=(pages[page]||renderHome)();

  window.currentPage=page;

  window.scrollTo({top:0,behavior:"smooth"});
}

function revealFlash(){
 flashRevealed=true;
 showPage("flashcards");
}

function flashAgain(){
 flashRevealed=false;
 flashIndex++;
 showPage("flashcards");
}

function flashKnown(){

 const l=currentLanguage;

 state.flashKnown[l.id+":"+flashIndex%l.words.length]=true;

 if(flashIndex===l.words.length-1){
   complete("lang:"+l.id+":1",15);
 }

 addXP(3);

 flashIndex++;
 flashRevealed=false;

 showPage("flashcards");
}

function startFlash(id){
 currentLanguage=languages.find(x=>x.id===id)||languages[0];
 flashIndex=0;
 flashRevealed=false;
 showPage("flashcards");
}

 Translate, shadow and understand complete sentences.
 </p>

 <div class="flashArea">

       ${l.name.toUpperCase()} • SENTENCE ${sentenceIndex%l.sentences.length+1}
     </div>

     <div class="example">

       <div class="foreign">${s[0]}</div>

       <div class="pron">${s[1]}</div>

       <div class="meaning">
         ${s[2]}
       </div>

     </div>

     <div class="grid grid2" style="margin-top:20px">

       <button class="secondary"
         onclick="speak('${escapeSpeech(s[0])}')">
         🔊 Listen
       </button>

       <button class="primary"
         onclick="addXP(4);nextSentence()">
         ✓ I Understand
       </button>

     </div>

   </div>

 </div>

 `;
}

function escapeSpeech(text){
 return text.replace(/'/g,"\\'");
}

function speak(text){

 if("speechSynthesis" in window){
   speechSynthesis.cancel();
   const u=new SpeechSynthesisUtterance(text);
   u.lang=
     currentLanguage.id==="arabic"?"ar":
     currentLanguage.id==="chinese"?"zh-CN":
     currentLanguage.id==="japanese"?"ja":
     currentLanguage.id==="korean"?"ko":
     currentLanguage.id==="russian"?"ru":
     currentLanguage.id==="french"?"fr":
     currentLanguage.id==="spanish"?"es":
     currentLanguage.id==="italian"?"it":"de";

   speechSynthesis.speak(u);
 }else{
   toast("Speech is not supported on this device.");
 }

}

function nextSentence(){

 sentenceIndex++;

 if(sentenceIndex%currentLanguage.sentences.length===0){
   complete("lang:"+currentLanguage.id+":2",15);
 }

 showPage("sentences");
}

function startSentences(id){

 currentLanguage=languages.find(x=>x.id===id)||languages[0];
 sentenceIndex=0;
 showPage("sentences");

}

/* =========================================================

   ========================================================= */

const quizQuestions=[

["Who wrote Hamlet?",["William Shakespeare","Charles Dickens","Dante","Goethe"],0],

["Which device is a direct comparison without 'like' or 'as'?",["Simile","Metaphor","Irony","Caesura"],1],

["The Great Gatsby is associated with which literary tradition?",["Russian","American","Japanese","Arabic"],1],

["Which language uses Hangul?",["Japanese","Chinese","Korean","Russian"],2],

["Who wrote The Divine Comedy?",["Dante","Petrarch","Cervantes","Camus"],0],

["Which theory focuses strongly on class and economic power?",["Marxist criticism","Formalism","Reader-response","Narratology"],0],

["Which work begins with Gregor Samsa's transformation?",["The Stranger","The Metamorphosis","Beloved","Don Quixote"],1],

["Which writing system is associated with Russian?",["Hangul","Arabic script","Cyrillic","Kanji"],2],

["Who wrote Things Fall Apart?",["Chinua Achebe","Wole Soyinka","Ngũgĩ","Mahfouz"],0],

["Enjambment is primarily associated with what?",["Poetry","Grammar only","Biography","Drama only"],0]

];

let quizIndex=0;
let quizScore=0;
let quizAnswered=false;

function renderQuiz(){

 if(quizIndex>=quizQuestions.length){

   const score=quizScore;

   if(score>state.quizBest){
     state.quizBest=score;
     saveState();
   }

   return `

   <div class="quiz">

     <div class="card quizResult">

       <div style="font-size:55px">🏆</div>

       <h1>Quiz Complete!</h1>

       <p style="color:var(--muted);margin:10px 0 25px">
         You scored <b>${score}/${quizQuestions.length}</b>.
       </p>

       <div class="progress">
         <div class="progressBar"
           style="width:${score/quizQuestions.length*100}%">
         </div>
       </div>

       <p style="margin-top:15px">
         Best score: ${state.quizBest}/${quizQuestions.length}
       </p>

       <button class="primary" style="margin-top:20px"
         onclick="restartQuiz()">
         Try Again
       </button>

     </div>

   </div>

   `;

 }

 const q=quizQuestions[quizIndex];

 return `

 <div class="quiz">

   <div class="card cardPad">

     <div style="display:flex;justify-content:space-between">
       <span class="tag">QUESTION ${quizIndex+1}/${quizQuestions.length}</span>
       <span style="color:var(--muted)">
         Score: ${quizScore}
       </span>
     </div>

     <div class="question">${q[0]}</div>

     ${q[1].map((option,i)=>`

       <button class="option"
         id="option-${i}"
         onclick="answerQuiz(${i})">
         ${option}
       </button>

     `).join("")}

   </div>

 </div>

 `;
}

function answerQuiz(i){

 if(quizAnswered)return;

 quizAnswered=true;

 const q=quizQuestions[quizIndex];
 const buttons=document.querySelectorAll(".option");

 buttons[q[2]].classList.add("correct");

 if(i===q[2]){
   quizScore++;
   addXP(5);
 }else{
   buttons[i].classList.add("wrong");
 }

 setTimeout(()=>{
   quizIndex++;
   quizAnswered=false;
   showPage("quiz");
 },800);

}

function restartQuiz(){

 quizIndex=0;
 quizScore=0;
 quizAnswered=false;
 showPage("quiz");

}

function saveNote(){

   date:new Date().toLocaleString()

 addXP(3);

 showPage("notes");

}

function deleteNote(i){

 state.notes.splice(i,1);

}

function escapeHTML(text){

 return text
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}

/* =========================================================
   SEARCH
   ========================================================= */

function globalSearch(value){

 value=value.trim().toLowerCase();

 if(!value){
   return;
 }

 const results=[];

 writers.forEach((w,i)=>{

   if(w.join(" ").toLowerCase().includes(value)){

     results.push({
       type:"Writer",
       title:w[0],
       text:`${w[1]} • ${w[3]} • ${w[4]}`,
       action:`openWriter(${i})`
     });

   }

 });

 works.forEach((w,i)=>{

   if(w.join(" ").toLowerCase().includes(value)){

     results.push({
       type:"Work",
       title:w[0],
       text:`${w[1]} • ${w[2]} • ${w[3]}`,
       action:`openWork(${i})`
     });

   }

 });

 devices.forEach((d,i)=>{

   if(d.join(" ").toLowerCase().includes(value)){

     results.push({
       type:"Device",
       title:d[0],
       text:d[1],
       action:`showPage('devices')`
     });

   }

 });

 languages.forEach(l=>{

   if((l.name+" "+l.native).toLowerCase().includes(value)){

     results.push({
       type:"Language",
       title:l.name,
       text:`${l.native} • ${l.script}`,
       action:`openLanguage('${l.id}')`
     });

   }

 });

 if(window.currentPage==="home" || value.length>0){

   const main=document.getElementById("main");

   main.innerHTML=`

   <h1 class="pageTitle">Search <span class="gradientText">Results</span></h1>

   <p class="pageSub">
     Results for <b>${escapeHTML(value)}</b>
   </p>

   <div class="searchResults">

   ${results.length?

     results.slice(0,30).map(r=>`

       <div class="result" onclick="${r.action}">

         <small>${r.type}</small>

         <h3>${r.title}</h3>

         <p>${r.text}</p>

       </div>

     `).join("")

     :

     `<div class="card cardPad">
       No matching content found.
     </div>`

   }

   </div>

   `;

 }

}

/* =========================================================
   MODAL
   ========================================================= */

function showModal(title,body){

 document.getElementById("modalTitle").textContent=title;
 document.getElementById("modalBody").innerHTML=body;
 document.getElementById("modalWrap").classList.add("show");

}

function closeModal(){

 document.getElementById("modalWrap").classList.remove("show");

}

/* =========================================================
   PARTICLES
   ========================================================= */

function createParticles(){

 const holder=document.getElementById("particles");

 for(let i=0;i<35;i++){

   const p=document.createElement("div");

   p.className="particle";

   p.style.left=Math.random()*100+"%";
   p.style.animationDuration=(10+Math.random()*18)+"s";
   p.style.animationDelay=(-Math.random()*20)+"s";
   p.style.opacity=(.08+Math.random()*.2);

   holder.appendChild(p);

 }

}

/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener("keydown",e=>{

 if(e.key==="Escape"){
   closeModal();
 }

 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){

   e.preventDefault();

   const search=document.getElementById("globalSearch");

   if(search){
     search.focus();
   }

 }

});

/* =========================================================
   START APP
   ========================================================= */

createParticles();
showPage("home");
